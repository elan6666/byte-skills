<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Choose the right supervision mode</title>
  <desc id="desc">Short waits use a same-task helper while the main chat keeps ownership. Long jobs use a supervisor, verified wake paths, evidence-based handback, and a confirmed main continuation.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d35"/><stop offset="1" stop-color="#182c46"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 8 5 0 9" fill="none" stroke="#91a8c2" stroke-width="1.5"/></marker>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}.note{font-size:16px;fill:#a9bbd1}.step{font-size:19px;font-weight:600;fill:#edf3fc}.tag{font-size:13px;letter-spacing:1.5px;font-weight:700}</style>
  </defs>
  <rect width="1200" height="720" rx="24" fill="url(#bg)"/>
  <text x="54" y="59" fill="#62ddd0" class="tag">WAITING, WITHOUT LOSING THE NEXT STEP</text>
  <text x="54" y="110" fill="#fff" font-size="35" font-weight="700">Keep short waits close. Hand long jobs over.</text>
  <text x="54" y="143" class="note">Choose by expected duration and whether the main turn needs to end.</text>
  <rect x="54" y="180" width="518" height="417" rx="18" fill="#172e43" stroke="#38616e"/>
  <rect x="600" y="180" width="546" height="417" rx="18" fill="#252c46" stroke="#50577f"/>
  <text x="80" y="217" fill="#77ecde" class="tag">SHORT WAIT · SAME TASK</text>
  <text x="80" y="250" class="note">Usually under ~1 hour, within the current turn</text>
  <text x="626" y="217" fill="#b1baff" class="tag">LONG JOB · SEPARATE CHAT</text>
  <text x="626" y="250" class="note">Usually ~1 hour or more, or needs unattended work</text>
  <rect x="80" y="279" width="466" height="66" rx="12" fill="#244759"/>
  <text x="313" y="306" class="step" text-anchor="middle">Main launches the bounded check</text>
  <text x="313" y="330" class="note" text-anchor="middle">Retains project ownership</text>
  <path d="M313 346 V367" fill="none" stroke="#91a8c2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="80" y="377" width="466" height="66" rx="12" fill="#244759"/>
  <text x="313" y="404" class="step" text-anchor="middle">Authorized helper observes and reports</text>
  <text x="313" y="428" class="note" text-anchor="middle">Use a cheaper supported model when appropriate</text>
  <path d="M313 444 V465" fill="none" stroke="#91a8c2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="80" y="475" width="466" height="66" rx="12" fill="#244759"/>
  <text x="313" y="502" class="step" text-anchor="middle">Main verifies and continues</text>
  <text x="313" y="526" class="note" text-anchor="middle">No cross-chat ownership transfer</text>
  <text x="80" y="573" fill="#77ecde" font-size="15">Quick commands can run directly without a helper.</text>
  <rect x="626" y="279" width="494" height="66" rx="12" fill="#353f60"/>
  <text x="873" y="306" class="step" text-anchor="middle">Main verifies launch and hands over</text>
  <text x="873" y="330" class="note" text-anchor="middle">Run ID, ownership, acceptance, and wake paths</text>
  <path d="M873 346 V367" fill="none" stroke="#91a8c2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="626" y="377" width="494" height="66" rx="12" fill="#353f60"/>
  <text x="873" y="404" class="step" text-anchor="middle">Supervisor checks the durable run</text>
  <text x="873" y="428" class="note" text-anchor="middle">Authorized event adapter and/or periodic checks</text>
  <path d="M873 444 V465" fill="none" stroke="#91a8c2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="626" y="475" width="494" height="66" rx="12" fill="#353f60"/>
  <text x="873" y="502" class="step" text-anchor="middle">Hand back, stop monitor, confirm main acts</text>
  <text x="873" y="526" class="note" text-anchor="middle">Evidence + baton return + continuation acknowledgement</text>
  <text x="626" y="573" fill="#b1baff" font-size="15">A delivered message alone does not confirm continuation.</text>
  <rect x="54" y="625" width="1092" height="55" rx="12" fill="#12243a" stroke="#34516c"/>
  <text x="600" y="659" class="note" text-anchor="middle">Verify idle-chat wakeup in your runtime. Pause or delete each run's monitor when its handoff ends.</text>
</svg>
