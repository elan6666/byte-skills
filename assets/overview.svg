<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Five ways in. One verified outcome.</title>
<desc id="desc">Five common Byte Skills entry points: do, auto, discuss, bridge, workflow. Other skills support intermediate work as needed.</desc>
<defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"PingFang SC","Microsoft YaHei",sans-serif}.name{font-size:24px;font-weight:700;fill:#f3f7ff}.caption{font-size:19px;fill:#d7e2f2}.note{font-size:16px;fill:#9fb3cb}</style></defs>
<rect width="1280" height="720" rx="24" fill="#101d31"/>
<text x="48" y="54" fill="#67e0d2" font-size="13" font-weight="700" letter-spacing="3">BYTE SKILLS</text>
<text x="48" y="108" fill="#f3f7ff" font-size="38" font-weight="700">Five ways in. One verified outcome.</text>
<text x="48" y="143" class="caption">Start with your intent. Let supporting skills handle the steps.</text>
<rect x="48" y="178" width="376" height="142" rx="16" fill="#1a2e47" stroke="#3a5774"/>
<rect x="70" y="200" width="28" height="4" rx="2" fill="#67e0d2"/>
<text x="70" y="237" class="name">byte-do</text>
<text x="70" y="270" class="caption">Describe it. Byte selects the skills.</text>
<text x="70" y="297" class="note">Natural language → useful actions</text>
<rect x="452" y="178" width="376" height="142" rx="16" fill="#1a2e47" stroke="#3a5774"/>
<rect x="474" y="200" width="28" height="4" rx="2" fill="#67e0d2"/>
<text x="474" y="237" class="name">byte-auto</text>
<text x="474" y="270" class="caption">Run the default delivery workflow.</text>
<text x="474" y="297" class="note">Plan → build → verify → repair → accept</text>
<rect x="856" y="178" width="376" height="142" rx="16" fill="#1a2e47" stroke="#3a5774"/>
<rect x="878" y="200" width="28" height="4" rx="2" fill="#67e0d2"/>
<text x="878" y="237" class="name">byte-discuss</text>
<text x="878" y="270" class="caption">Think it through together.</text>
<text x="878" y="297" class="note">Clarify scope · compare · decide</text>
<rect x="48" y="348" width="578" height="142" rx="16" fill="#26304c" stroke="#a9a0ff" stroke-width="2"/>
<rect x="70" y="370" width="28" height="4" rx="2" fill="#b8b1ff"/>
<text x="70" y="407" class="name">byte-bridge</text><text x="598" y="381" text-anchor="end" fill="#c1bbff" font-size="12" font-weight="700">CHAT + AGENT</text>
<text x="70" y="440" class="caption">Connect chats. Delegate. Supervise. Return.</text>
<text x="70" y="467" class="note">Connect → delegate / supervise → verify &amp; continue</text>
<rect x="654" y="348" width="578" height="142" rx="16" fill="#1a2e47" stroke="#3a5774"/>
<rect x="676" y="370" width="28" height="4" rx="2" fill="#67e0d2"/>
<text x="676" y="407" class="name">byte-workflow</text>
<text x="676" y="440" class="caption">Save a workflow of your own.</text>
<text x="676" y="467" class="note">Steps · loops · acceptance · roles → reuse locally</text>
<rect x="48" y="522" width="1184" height="110" rx="16" fill="#13243a" stroke="#314a65"/>
<text x="72" y="554" fill="#67e0d2" font-size="16" font-weight="600">SUPPORTING CAPABILITIES · Selected as needed; callable directly</text>
<text x="72" y="585" class="caption">byte-brainstorm · byte-research · byte-plan · byte-build · byte-review</text>
<text x="72" y="612" class="note">byte-future · byte-status · byte-relay · byte-design-supervise</text>
<text x="48" y="676" class="note">Choose an entry, not a mandatory sequence. Cross-chat messaging and schedules require client support and authorization.</text>
</svg>
