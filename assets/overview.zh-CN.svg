<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">五个常用入口，按任务选择。</title>
<desc id="desc">五个常用入口：do、auto、discuss、design-supervise、workflow。其余技能作为中间能力按需组合。</desc>
<defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"PingFang SC","Microsoft YaHei",sans-serif}.name{font-size:24px;font-weight:700;fill:#f3f7ff}.caption{font-size:19px;fill:#d7e2f2}.note{font-size:16px;fill:#9fb3cb}</style></defs>
<rect width="1280" height="720" rx="24" fill="#101d31"/>
<text x="48" y="54" fill="#67e0d2" font-size="13" font-weight="700" letter-spacing="3">BYTE SKILLS</text>
<text x="48" y="108" fill="#f3f7ff" font-size="38" font-weight="700">五个常用入口，按任务选择。</text>
<text x="48" y="143" class="caption">用自然语言开始，让中间能力按需衔接。</text>
<rect x="48" y="178" width="376" height="142" rx="16" fill="#1a2e47" stroke="#3a5774"/>
<rect x="70" y="200" width="28" height="4" rx="2" fill="#67e0d2"/>
<text x="70" y="237" class="name">byte-do</text>
<text x="70" y="270" class="caption">描述需求，自动选技能</text>
<text x="70" y="297" class="note">自然语言需求 → 按需组合与执行</text>
<rect x="452" y="178" width="376" height="142" rx="16" fill="#1a2e47" stroke="#3a5774"/>
<rect x="474" y="200" width="28" height="4" rx="2" fill="#67e0d2"/>
<text x="474" y="237" class="name">byte-auto</text>
<text x="474" y="270" class="caption">自动推进默认完整流程</text>
<text x="474" y="297" class="note">规划 → 实现 → 核验 → 修复 → 验收</text>
<rect x="856" y="178" width="376" height="142" rx="16" fill="#1a2e47" stroke="#3a5774"/>
<rect x="878" y="200" width="28" height="4" rx="2" fill="#67e0d2"/>
<text x="878" y="237" class="name">byte-discuss</text>
<text x="878" y="270" class="caption">先讨论，把方向想清楚</text>
<text x="878" y="297" class="note">澄清需求 · 比较方案 · 明确取舍</text>
<rect x="48" y="348" width="578" height="142" rx="16" fill="#1a2e47" stroke="#3a5774"/>
<rect x="70" y="370" width="28" height="4" rx="2" fill="#67e0d2"/>
<text x="70" y="407" class="name">byte-design-supervise</text>
<text x="70" y="440" class="caption">跨对话监督长任务</text>
<text x="70" y="467" class="note">主会话确认启动 → 监督会话 → 主会话核验并继续</text>
<rect x="654" y="348" width="578" height="142" rx="16" fill="#1a2e47" stroke="#3a5774"/>
<rect x="676" y="370" width="28" height="4" rx="2" fill="#67e0d2"/>
<text x="676" y="407" class="name">byte-workflow</text>
<text x="676" y="440" class="caption">保存你自己的工作流</text>
<text x="676" y="467" class="note">自定义步骤 · 循环 · 验收 · 分工 → 本地复用</text>
<rect x="48" y="522" width="1184" height="110" rx="16" fill="#13243a" stroke="#314a65"/>
<text x="72" y="554" fill="#67e0d2" font-size="16" font-weight="600">中间能力 · 由入口按需组合，也可单独调用</text>
<text x="72" y="585" class="caption">byte-brainstorm · byte-research · byte-plan · byte-build · byte-review</text>
<text x="72" y="612" class="note">byte-future · byte-status · byte-relay</text>
<text x="48" y="676" class="note">入口不是必经顺序。跨对话通信与定时检查依赖客户端能力和授权。</text>
</svg>
