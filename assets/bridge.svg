<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="590" viewBox="0 0 1280 590" role="img" aria-labelledby="title desc">
<title id="title">Byte Bridge — Share the work. Bring the result back.</title><desc id="desc">Main delegates through Byte Bridge to a worker or supervisor. Evidence returns to main for verification and continuation.</desc>
<defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"PingFang SC","Microsoft YaHei",sans-serif}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#b0a8ff" stroke-width="1.5"/></marker></defs>
<rect width="1280" height="590" rx="24" fill="#101d31"/>
<text x="48" y="49" font-size="13" fill="#b8b1ff" font-weight="700" text-anchor="start">BYTE BRIDGE</text>
<text x="48" y="102" font-size="36" fill="#f3f7ff" font-weight="700" text-anchor="start">Share the work. Bring the result back.</text>
<text x="48" y="140" font-size="19" fill="#b7c8dc" font-weight="400" text-anchor="start">Connect original chats · Assign roles · Delegate within scope · Verify and continue</text>
<rect x="48" y="233" width="326" height="160" rx="18" fill="#1a2e47" stroke="#41617d"/>
<text x="74" y="277" font-size="26" fill="#f3f7ff" font-weight="700" text-anchor="start">Main chat</text>
<text x="74" y="318" font-size="18" fill="#b7c8dc" font-weight="400" text-anchor="start">Design · Core code · Tests</text>
<text x="74" y="352" font-size="16" fill="#b7c8dc" font-weight="400" text-anchor="start">Launch and verify startup</text>
<rect x="435" y="233" width="352" height="160" rx="18" fill="#29304e" stroke="#b0a8ff" stroke-width="2"/>
<text x="461" y="277" font-size="27" fill="#eeeaff" font-weight="700" text-anchor="start">byte-bridge</text>
<text x="461" y="318" font-size="18" fill="#b7c8dc" font-weight="400" text-anchor="start">Connect · Deliver · Supervise</text>
<text x="461" y="352" font-size="16" fill="#b7c8dc" font-weight="400" text-anchor="start">Exact identity / scope / return route</text>
<rect x="850" y="191" width="382" height="109" rx="16" fill="#1a2e47" stroke="#41617d"/>
<text x="876" y="233" font-size="23" fill="#f3f7ff" font-weight="700" text-anchor="start">Worker chat</text>
<text x="876" y="268" font-size="17" fill="#b7c8dc" font-weight="400" text-anchor="start">Scoped implementation and tests</text>
<rect x="850" y="326" width="382" height="109" rx="16" fill="#17363e" stroke="#4a9189"/>
<text x="876" y="368" font-size="23" fill="#8aebdb" font-weight="700" text-anchor="start">Supervisor chat</text>
<text x="876" y="403" font-size="17" fill="#b7c8dc" font-weight="400" text-anchor="start">Long run · Events / periodic fallback</text>
<g fill="none" stroke="#b0a8ff" stroke-width="2" marker-end="url(#arrow)"><path d="M374 313H425"/><path d="M787 285H816V245H840"/><path d="M787 341H816V380H840"/><path d="M1232 245H1250V474H1040"/><path d="M1040 435V474H211V403"/></g>
<rect x="300" y="451" width="720" height="49" rx="12" fill="#101d31" stroke="#3d536f"/>
<text x="660" y="482" font-size="17" fill="#ded8ff" font-weight="500" text-anchor="middle">Return logs, metrics and artifacts → Main verifies → Execute the next step</text>
<text x="48" y="552" font-size="16" fill="#b7c8dc" font-weight="400" text-anchor="start">Same app / cross app · Activation, events and idle wake depend on the client and session mode</text>
</svg>
