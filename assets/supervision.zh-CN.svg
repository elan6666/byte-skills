<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">选择合适的监督方式</title>
  <desc id="desc">短等待由获授权的同会话助手处理，长任务使用独立监督会话，核对唤醒路径、交回证据与主会话接手。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d35"/><stop offset="1" stop-color="#182c46"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 8 5 0 9" fill="none" stroke="#91a8c2" stroke-width="1.5"/></marker>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,'PingFang SC','Microsoft YaHei',sans-serif}.note{font-size:16px;fill:#a9bbd1}.step{font-size:19px;font-weight:600;fill:#edf3fc}.tag{font-size:13px;letter-spacing:1.5px;font-weight:700}</style>
  </defs>
  <rect width="1200" height="720" rx="24" fill="url(#bg)"/>
  <text x="54" y="59" fill="#62ddd0" class="tag">等待期间，保留下一步行动</text>
  <text x="54" y="110" fill="#fff" font-size="35" font-weight="700">短等待留在当前任务，长运行明确交接。</text>
  <text x="54" y="143" class="note">根据预计耗时，以及是否需要在主会话结束后继续运行来选择。</text>
  <rect x="54" y="180" width="518" height="417" rx="18" fill="#172e43" stroke="#38616e"/>
  <rect x="600" y="180" width="546" height="417" rx="18" fill="#252c46" stroke="#50577f"/>
  <text x="80" y="217" fill="#77ecde" class="tag">短等待 · 当前任务内</text>
  <text x="80" y="250" class="note">通常约一小时以内，能在当前回合完成</text>
  <text x="626" y="217" fill="#b1baff" class="tag">长运行 · byte-bridge</text>
  <text x="626" y="250" class="note">通常约一小时以上，或需要无人值守</text>
  <rect x="80" y="279" width="466" height="66" rx="12" fill="#244759"/>
  <text x="313" y="306" class="step" text-anchor="middle">主会话启动范围明确的检查</text>
  <text x="313" y="330" class="note" text-anchor="middle">主会话保留项目工作权限</text>
  <path d="M313 346 V367" fill="none" stroke="#91a8c2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="80" y="377" width="466" height="66" rx="12" fill="#244759"/>
  <text x="313" y="404" class="step" text-anchor="middle">获授权的助手观察并回报</text>
  <text x="313" y="428" class="note" text-anchor="middle">可按需要使用运行环境支持的较低成本模型</text>
  <path d="M313 444 V465" fill="none" stroke="#91a8c2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="80" y="475" width="466" height="66" rx="12" fill="#244759"/>
  <text x="313" y="502" class="step" text-anchor="middle">主会话核验并继续工作</text>
  <text x="313" y="526" class="note" text-anchor="middle">不发生跨会话的所有权转移</text>
  <text x="80" y="573" fill="#77ecde" font-size="15">很快能完成的命令由主助手直接执行。</text>
  <rect x="626" y="279" width="494" height="66" rx="12" fill="#353f60"/>
  <text x="873" y="306" class="step" text-anchor="middle">主会话确认真实启动后交接</text>
  <text x="873" y="330" class="note" text-anchor="middle">运行身份、工作权限、验收条件和唤醒路径</text>
  <path d="M873 346 V367" fill="none" stroke="#91a8c2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="626" y="377" width="494" height="66" rx="12" fill="#353f60"/>
  <text x="873" y="404" class="step" text-anchor="middle">监督者检查已登记的真实运行</text>
  <text x="873" y="428" class="note" text-anchor="middle">已授权的事件适配器或周期检查</text>
  <path d="M873 444 V465" fill="none" stroke="#91a8c2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="626" y="475" width="494" height="66" rx="12" fill="#353f60"/>
  <text x="873" y="502" class="step" text-anchor="middle">交回证据、停用监控、确认主会话行动</text>
  <text x="873" y="526" class="note" text-anchor="middle">核验证据、交回工作权限、确认实际续接</text>
  <text x="626" y="573" fill="#b1baff" font-size="15">消息送达，仍需要核对主会话是否实际接手。</text>
  <rect x="54" y="625" width="1092" height="55" rx="12" fill="#12243a" stroke="#34516c"/>
  <text x="600" y="659" class="note" text-anchor="middle">需在实际客户端验证空闲会话唤醒；每次运行交回后，暂停或移除该次监控。</text>
</svg>
