name: Byte Bridge checks
on: [push, pull_request]
jobs:
  offline-behavior:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/byte-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: packages/byte-bridge/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: python3 -m unittest discover -s tests/python -p 'test_hermes_plugin.py'
      - run: npm run pack:plugins
      - run: npm pack --ignore-scripts
      - name: Verify Byte runtime generation
        working-directory: .
        run: python3 scripts/build_bridge_runtime.py --build --check
